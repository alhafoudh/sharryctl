# Copy to ~/.config/sharry/config.toml (chmod 600) or use `sharryctl config tenants add`.
# Never commit real tenant credentials.

default_tenant = "example"

[tenants.example]
# Subdomain of https://<slug>.sharryapp.com is the table key above.
application_token = ""   # also sent as client_id during login
api_secret = ""          # HMAC key for the Request-Sign header
